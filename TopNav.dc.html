<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;max-width:1168px;margin:0 auto;padding:{{ navPad }};">
  <a href="./" aria-label="Vista Eagles Swim home" style="display:flex;align-items:center;gap:10px;height:{{ brandH }};padding:{{ brandPad }};border-radius:999px;text-decoration:none;background:rgba(var(--glass-rgb, 255,255,255),calc(.06 * var(--glass-k, 1)));border:1px solid rgba(var(--glass-rgb, 255,255,255),calc(.1 * var(--glass-k, 1)));backdrop-filter:blur(30px) saturate(120%) brightness(var(--bd-b, .45));-webkit-backdrop-filter:blur(30px) saturate(120%) brightness(var(--bd-b, .45));box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(var(--glass-rgb, 255,255,255),calc(.08 * var(--glass-k, 1)));" style-hover="border-color:rgba(var(--glass-rgb, 255,255,255),calc(.3 * var(--glass-k, 1)));">
    <img src="./brand/vista-eagle.svg" alt="" style="height:{{ eagleH }};width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));">
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;flex-direction:column;gap:4px;">
        <img src="./brand/vista-wordmark.svg" alt="" style="height:13px;width:auto;display:block;">
        <span style="font-family:'Geist Mono',monospace;font-size:9px;line-height:1;letter-spacing:.3em;color:rgba(200,212,230,.75);">EAGLES SWIM</span>
      </span>
    </sc-if>
  </a>
  <div style="position:relative;display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(var(--glass-rgb, 255,255,255),calc(.06 * var(--glass-k, 1)));border:1px solid rgba(var(--glass-rgb, 255,255,255),calc(.1 * var(--glass-k, 1)));backdrop-filter:blur(30px) saturate(120%) brightness(var(--bd-b, .45));-webkit-backdrop-filter:blur(30px) saturate(120%) brightness(var(--bd-b, .45));box-shadow:0 8px 30px rgba(0,0,0,.25), inset 0 1px 0 rgba(var(--glass-rgb, 255,255,255),calc(.08 * var(--glass-k, 1)));">
    <div style="position:absolute;top:5px;bottom:5px;left:{{ pillLeft }};width:{{ pillWidth }};opacity:{{ pillOpacity }};border-radius:999px;background:linear-gradient(180deg,#ffffff,#c3ccd9);box-shadow:0 2px 12px rgba(0,0,0,.3), inset 0 -1px 0 rgba(0,32,78,.15);transition:{{ pillTransition }};"></div>
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <a href="{{ l.href }}" ref="{{ l.ref }}" onClick="{{ l.go }}" style="position:relative;z-index:1;padding:{{ l.pad }};border-radius:999px;font-family:'Geist',system-ui,sans-serif;font-size:13px;font-weight:500;text-decoration:none;color:{{ l.color }};box-shadow:inset 0 0 0 1px transparent;transition:color .3s ease, box-shadow .2s ease;" style-hover="box-shadow:inset 0 0 0 1px rgba(var(--glass-rgb, 255,255,255),calc(.35 * var(--glass-k, 1)));">{{ l.label }}</a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Home&quot;,&quot;JV&quot;,&quot;Varsity&quot;,&quot;Coaches&quot;,&quot;Equipment&quot;],&quot;default&quot;:&quot;JV&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LINKS = [
  ['JV', 'jv'],
  ['Varsity', 'varsity'],
  ['Coaches', 'coaches'],
  ['Equipment', 'equipment'],
];
class Component extends DCLogic {
  refs = LINKS.map(() => React.createRef());
  state = { cur: null, left: 0, width: 0, animate: false, shown: false, vw: window.innerWidth || 1024 };
  activeIndex() { return LINKS.findIndex(([l]) => l === (this.props.active ?? 'JV')); } // -1 on the landing page: no tab highlighted
  measure(i) { const el = this.refs[i].current; return el ? { left: el.offsetLeft, width: el.offsetWidth } : null; }
  componentDidMount() {
    const place = () => { const i = this.state.cur ?? this.activeIndex(); if (i < 0) { if (this.state.shown) this.setState({ shown: false }); return; } const m = this.measure(i); if (m) this.setState({ ...m, cur: i, shown: true }); };
    place();
    if (document.fonts) document.fonts.ready.then(place);
    this._rs = () => this.setState({ vw: window.innerWidth }, place);
    window.addEventListener('resize', this._rs);
    this._ps = e => { if (e.persisted) { this.setState({ animate: false, cur: this.activeIndex() }, place); } };
    window.addEventListener('pageshow', this._ps);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._rs); window.removeEventListener('pageshow', this._ps); clearTimeout(this._t); }
  go(i, e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    const href = LINKS[i][1];
    if (i === this.state.cur) return;
    const m = this.measure(i);
    const from = this.state.cur ?? this.activeIndex();
    this.setState({ ...m, cur: i, animate: from >= 0, shown: true });
    clearTimeout(this._t);
    this._t = setTimeout(() => { window.location.href = href; }, 380);
  }
  renderVals() {
    const cur = this.state.cur ?? this.activeIndex();
    const vw = this.state.vw, tight = vw < 480;
    return {
      wide: vw >= 720,
      navPad: tight ? '12px 12px 0' : '14px 24px 0',
      brandH: tight ? '42px' : '46px', brandPad: tight ? '0 10px 0 8px' : '0 16px 0 10px', eagleH: tight ? '26px' : '30px',
      pillLeft: `${this.state.left}px`,
      pillWidth: `${this.state.width}px`,
      pillOpacity: this.state.shown ? 1 : 0,
      pillTransition: this.state.animate ? 'left .38s cubic-bezier(.65,0,.25,1), width .38s cubic-bezier(.65,0,.25,1)' : 'none',
      links: LINKS.map(([label, href], i) => ({
        label, href, ref: this.refs[i],
        color: i === cur ? '#00204e' : 'rgba(var(--ink, 238,242,248),.72)',
        pad: tight ? '8px 11px' : '8px 18px',
        go: e => this.go(i, e),
      })),
    };
  }
}
</script>
</body>
</html>
