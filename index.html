<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista del Lago Eagles Swim &amp; Dive</title>
<link rel="icon" type="image/svg+xml" href="brand/vista-eagle.svg">
<!-- Everything the page needs is listed here so the browser fetches it all at once, in parallel. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" href="./TopNav.dc.html" as="fetch" crossorigin>
<style>
x-dc{display:none;}
html,body{margin:0;padding:0;background:var(--page-base,#000);}
body{font-family:'Geist',system-ui,sans-serif;color:rgb(var(--ink, 238,242,248));-webkit-font-smoothing:antialiased;}
*{box-sizing:border-box;}
a{color:inherit;text-decoration:none;}
</style>
<script src="./theme.js"></script>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./support.js"></script>
<script src="./season-data.js"></script>
<script src="./ripple-bg.js" defer></script>
<script src="./speed.js" defer></script>
</head>
<body>
<x-dc>
<div data-ripple-host="1" style="isolation:isolate;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden;background:var(--page-bg, #020a1d);background-attachment:fixed;">
  <dc-import name="TopNav" active="Home" style="position:sticky;top:0;z-index:20;display:block;" hint-size="100%,62px"></dc-import>

  <header style="position:relative;width:100%;max-width:1120px;margin:0 auto;padding:56px 24px 40px;display:flex;flex-wrap:wrap-reverse;align-items:center;justify-content:space-between;gap:24px 48px;">
    <img src="./brand/vista-eagle-line.svg" alt="" aria-hidden="true" style="position:absolute;z-index:-1;top:-40px;left:-220px;width:min(820px,110vw);height:auto;opacity:.045;pointer-events:none;user-select:none;transform:scaleX(-1);">
    <div style="flex:1 1 460px;min-width:0;">
      <h1 style="margin:0;font-weight:300;font-size:clamp(48px,8vw,96px);letter-spacing:-.04em;line-height:1.02;padding-bottom:.05em;background:linear-gradient(180deg,#ffffff 35%,#b2bdcd);-webkit-background-clip:text;background-clip:text;color:transparent;">Eagles<br>Swim &amp; Dive</h1>
      <div style="display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:8px 14px 8px 12px;border-radius:999px;background:rgba(var(--glass-rgb, 255,255,255),.07);border:1px solid rgba(var(--glass-rgb, 255,255,255),.12);font-size:13px;color:rgba(var(--ink, 238,242,248),.85);">
        <span style="width:8px;height:8px;border-radius:50%;background:#7ec8f4;box-shadow:0 0 12px #7ec8f4;"></span>{{ status }}
      </div>
    </div>
    <div style="flex:0 1 360px;display:flex;justify-content:center;">
      <img src="./brand/vista-logo.svg" alt="Vista Eagles logo" style="width:min(360px,62vw);height:auto;display:block;filter:drop-shadow(0 24px 60px rgba(0,32,78,.95)) drop-shadow(0 0 48px rgba(120,160,230,.14));">
    </div>
  </header>

  <main style="flex:1;width:100%;max-width:1120px;margin:0 auto;padding:0 24px 64px;display:flex;flex-direction:column;gap:40px;">

    <sc-if value="{{ hasUpNext }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Up next" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;">
        <sc-for list="{{ upNext }}" as="u" hint-placeholder-count="2">
          <a href="jv.html" style="display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:20px;background:var(--frost, none), linear-gradient(160deg, rgba(var(--glass-rgb, 255,255,255),calc(.07 * var(--glass-k, 1))), rgba(var(--glass-rgb, 255,255,255),calc(.02 * var(--glass-k, 1))));border:1px solid rgba(var(--glass-rgb, 255,255,255),calc(.1 * var(--glass-k, 1)));backdrop-filter:var(--glass-bf, blur(26px) saturate(130%) brightness(var(--bd-b, .55)));-webkit-backdrop-filter:var(--glass-bf, blur(26px) saturate(130%) brightness(var(--bd-b, .55)));box-shadow:inset 0 1px 0 rgba(var(--glass-rgb, 255,255,255),calc(.1 * var(--glass-k, 1)));transition:border-color .2s ease, transform .2s ease;" style-hover="border-color:rgba(var(--glass-rgb, 255,255,255),.28);transform:translateY(-2px);">
            <span style="flex-shrink:0;width:44px;height:44px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(var(--glass-rgb, 255,255,255),.07);border:1px solid rgba(var(--glass-rgb, 255,255,255),.1);">
              <span style="font-family:'Geist Mono',monospace;font-size:9px;letter-spacing:.08em;color:{{ u.color }};">{{ u.mon }}</span>
              <span style="font-size:17px;font-weight:500;line-height:1.1;">{{ u.day }}</span>
            </span>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0;">
              <span style="font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:{{ u.color }};">{{ u.label }}</span>
              <span style="font-size:16px;font-weight:500;line-height:1.3;">{{ u.title }}</span>
              <span style="font-size:13px;line-height:1.4;color:rgba(var(--ink, 238,242,248),.55);">{{ u.note }}</span>
            </span>
          </a>
        </sc-for>
      </section>
    </sc-if>


    <sc-if value="{{ hasMilestones }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Season at a glance" style="border-radius:24px;padding:22px 24px 24px;background:var(--frost, none), linear-gradient(rgba(var(--glass-rgb, 255,255,255),calc(.04 * var(--glass-k, 1))), rgba(var(--glass-rgb, 255,255,255),calc(.04 * var(--glass-k, 1))));border:1px solid rgba(var(--glass-rgb, 255,255,255),calc(.08 * var(--glass-k, 1)));backdrop-filter:var(--glass-bf, blur(26px) saturate(130%) brightness(var(--bd-b, .55)));-webkit-backdrop-filter:var(--glass-bf, blur(26px) saturate(130%) brightness(var(--bd-b, .55)));">
        <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin-bottom:20px;">
          <h2 style="margin:0;font-size:18px;font-weight:500;letter-spacing:-.01em;">Season at a glance</h2>
          <span style="font-family:'Geist Mono',monospace;font-size:11px;color:rgba(200,212,230,.6);">Feb 8 – May 17, 2027</span>
        </div>
        <div style="overflow-x:auto;padding-bottom:4px;">
          <div style="position:relative;min-width:max-content;">
          <span aria-hidden="true" style="position:absolute;left:6px;right:6px;top:6px;height:1px;background:linear-gradient(90deg, rgba(200,212,230,.35), rgba(200,212,230,.12));"></span>
          <ol style="position:relative;display:flex;margin:0;padding:0;list-style:none;">
            <sc-for list="{{ milestones }}" as="m" hint-placeholder-count="7">
              <li style="position:relative;width:148px;flex:none;display:flex;flex-direction:column;gap:6px;padding-right:12px;opacity:{{ m.opacity }};">
                <span style="width:13px;height:13px;border-radius:50%;background:{{ m.color }};box-shadow:{{ m.ring }};"></span>
                <span style="margin-top:6px;font-size:14px;font-weight:500;">{{ m.label }}</span>
                <span style="font-family:'Geist Mono',monospace;font-size:12px;color:rgba(200,212,230,.7);">{{ m.date }}</span>
                <sc-if value="{{ m.isNext }}" hint-placeholder-val="{{ false }}">
                  <span style="align-self:flex-start;margin-top:2px;font-size:10px;font-weight:500;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:linear-gradient(180deg,#ffffff,#c3ccd9);color:#00204e;">UP NEXT</span>
                </sc-if>
              </li>
            </sc-for>
          </ol>
          </div>
        </div>
      </section>
    </sc-if>
  </main>

  <footer style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 24px 40px;border-top:1px solid rgba(var(--glass-rgb, 255,255,255),.06);">
    <div style="text-align:center;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,212,230,.62);">Vista del Lago Eagles · Swim &amp; Dive · 2027 Season</div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
const TINT = {
  tryout:'#b8cce8', tech:'#7ec8f4', build:'#5ce6a0', refine:'#f9a55a', taper:'#ffb07a',
  ff:'#d0dce8', meet:'#ff6b8e', champs:'#b49cf5', bprac:'#8fa6c4', bye:'#8a96aa',
  secprac:'#b07ae8', sections:'#c77dff', state:'#ff7070', banquet:'#6ee87c', off:'#556',
};
// Same reveal rules as the season plans: future workouts stay hidden until practice day.
const NOT_PRACTICE = ['off','meet','champs','sections','state','banquet'];
const MEETS = ['meet','champs','sections','state'];
const MASK_TITLE = ['tech','build','refine','taper'];
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const longDate = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

class Component extends DCLogic {
  state = { ready: !!window.SEASON };
  componentDidMount() {
    if (!window.SEASON) this._t = setInterval(() => { if (window.SEASON) { clearInterval(this._t); this.setState({ ready: true }); } }, 50);
  }
  componentWillUnmount() { clearInterval(this._t); }

  card(x, label, title, note) {
    return {
      label, title, note, color: TINT[x.day.t] || '#7ec8f4',
      mon: x.date.toLocaleDateString('en-US', { month: 'short' }).toUpperCase(),
      day: String(x.date.getDate()),
    };
  }

  renderVals() {
    const S = window.SEASON;
    const base = { status: '2027 season · Feb 8 – May 17', hasUpNext: false, upNext: [], hasMilestones: false, milestones: [] };
    if (!S) return base;
    const today = startOfToday();
    const days = [];
    S.weeks.forEach(wk => wk.days.forEach((day, di) => {
      const date = new Date(wk.mon); date.setDate(date.getDate() + di); date.setHours(0,0,0,0);
      days.push({ wk, day, date });
    }));
    const first = days[0].date;
    const banquet = days.find(x => x.day.t === 'banquet');
    const end = banquet ? banquet.date : days[days.length - 1].date;

    let status;
    if (today < first) {
      const n = Math.round((first - today) / 864e5);
      status = `Season starts ${longDate(first)} · ${n} day${n === 1 ? '' : 's'} to go`;
    } else if (today > end) {
      status = '2027 season complete · Fly Eagles Fly';
    } else {
      const wk = S.weeks.find(w => { const e = new Date(w.mon); e.setDate(e.getDate() + 7); return today >= w.mon && today < e; });
      status = !wk ? 'In season' : typeof wk.wk === 'number' ? `This week · Week ${wk.wk} · ${wk.badge}` : `This week · ${wk.badge}`;
    }

    const upNext = [];
    const np = days.find(x => !NOT_PRACTICE.includes(x.day.t) && x.day.title && x.date >= today);
    if (np) {
      const isToday = +np.date === +today;
      const title = !isToday && MASK_TITLE.includes(np.day.t) ? 'Standard Practice' : np.day.title;
      upNext.push(this.card(np, isToday ? 'Today' : 'Next practice', title, isToday ? (np.day.detail || longDate(np.date)) : `${longDate(np.date)} · workout unlocks that day`));
    }
    const nm = days.find(x => MEETS.includes(x.day.t) && x.date >= today);
    if (nm) upNext.push(this.card(nm, +nm.date === +today ? 'Meet day' : 'Next meet', nm.day.title, nm.day.detail || longDate(nm.date)));

    const firstOf = pred => days.find(pred);
    const ms = [
      ['Tryouts', firstOf(x => x.day.t === 'tryout'), 'tryout'],
      ['Build Phase', firstOf(x => x.wk.phase === 'build'), 'build'],
      ['Spring Break', firstOf(x => x.day.t === 'bprac'), 'bprac'],
      ['League Champs', firstOf(x => x.day.t === 'champs'), 'champs'],
      ['Sections', firstOf(x => x.day.t === 'sections'), 'sections'],
      ['State', firstOf(x => x.day.t === 'state'), 'state'],
      ['Banquet', banquet, 'banquet'],
    ].filter(m => m[1]);
    const nextIdx = ms.findIndex(m => m[1].date >= today);
    const milestones = ms.map(([label, x, t], i) => ({
      label, date: S.fmt(x.date), color: TINT[t],
      opacity: nextIdx < 0 || i < nextIdx ? .45 : 1,
      isNext: i === nextIdx,
      ring: i === nextIdx ? `0 0 0 4px color-mix(in srgb, ${TINT[t]} 30%, transparent), 0 0 14px ${TINT[t]}` : 'none',
    }));

    return { ...base, status, upNext, hasUpNext: upNext.length > 0, milestones, hasMilestones: milestones.length > 0 };
  }
}
</script>
</body>
</html>
